<script type="text/x-red" data-template-name="klicktipp-subscriber-untag">
	<div class="form-row">
		<label for="node-input-name">
			<i class="fa fa-tag"></i> <span>Name</span>
		</label>
		<input type="text" id="node-input-name" placeholder="Enter node name">
	</div>
	<div class="form-row">
		<label for="node-input-klicktipp">
			<i class="fa fa-cog"></i> <span>KlickTipp Config</span>
		</label>
		<input type="text" id="node-input-klicktipp" data-i18n="config node">
	</div>
	<div class="form-row">
		<label for="node-input-email">
			<i class="fa fa-envelope"></i> <span>Email Address</span>
		</label>
		<input type="text" id="node-input-email" placeholder="Enter email address (required)">
		<input type="hidden" id="node-input-emailType">
	</div>
	<div class="form-row" style="display: flex; align-items: center;">
		<label style="flex: 0 0 auto;" for="node-input-tagId">
			<i class="fa fa-tag"></i> <span>Tag IDs</span>
		</label>
		<div style="flex: 1; display: flex; margin-left: 4px; gap: 10px; align-items: center;">
			<select id="node-input-tagId" multiple style="height: auto; width: 100%;"></select>
			<input type="text" id="node-input-tagIdManual" style="flex: 1; display: none;" placeholder="Enter tag IDs (comma separated)">
			<button
				id="btn-create-tag-untag"
				type="button"
				title="Create new tag"
				style="flex: 0 0 auto; height: 28px; min-height: 28px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center;"
			>
				<i class="fa fa-plus"></i>
			</button>
		</div>
		<div style="display: flex; flex-direction: row; align-items: center; width: 70px; margin-left: 10px;">
			<div style="margin: 0 6px;">Map</div>
			<input style="margin-top: 0 !important; width: 20%" type="checkbox" id="node-input-toggleFieldType">
		</div>
	</div>

	<div id="create-tag-modal-untag" title="Create Tag" style="display: none;">
		<div class="form-row" style="display:flex; align-items:center; margin-bottom:8px;">
			<label for="create-tag-name-untag" style="padding-right: 8px; white-space: nowrap;">
				<i class="fa fa-tag"></i> <span>Name</span>
			</label>
			<input type="text" id="create-tag-name-untag" placeholder="Enter name (required)" style="flex:1;">
		</div>
		<div class="form-row" style="display:flex; align-items:center;">
			<label for="create-tag-text-untag" style="padding-right: 8px; white-space: nowrap;">
				<i class="fa fa-sticky-note"></i> <span>Description</span>
			</label>
			<input type="text" id="create-tag-text-untag" placeholder="Enter description" style="flex:1;">
		</div>
	</div>
</script>

<script type="text/x-red" data-help-name="klicktipp-subscriber-untag">
	<p>Removes a tag from a contact</p>

	<h3>Inputs</h3>
	<dl class="message-properties">
	    <dt>msg.payload <span class="property-type">object</span></dt>
	    <dd>
	        Expected object with the following properties:
	        <ul>
	            <li><code>email</code> - (Required) the contact's email address</li>
	            <li><code>tagId</code> - (Required) a single tag ID for backward compatibility</li>
	            <li><code>tagIds</code> - (Required) one or more tag IDs. You can pass an array for multiple tags.</li>
	        </ul>
	    </dd>
	</dl>

	  <h3>Outputs</h3>
	  <dl class="message-properties">
	   <dt>msg.payload <span class="property-type">object</span></dt>
	   <dd>
		   On success:
		   <ul>
			   <li><code>{ success: true }</code></li>
		   </ul>
	   </dd>
	   <dd>
		   On failure:
		   <ul>
			   <li><code>{ success: false }</code></li>
		   </ul>
	   </dd>

	   <dt>msg.error <span class="property-type">string</span></dt>
	   <dd>An error message indicating why the request failed.</dd>
	  </dl>

	<h3>Node Status</h3>
	<ul>
	    <li><strong>Green (dot)</strong> - The email was untagged successfully.</li>
	    <li><strong>Red (ring)</strong> - The untagging process failed (e.g., missing email, tag ID, or API error).</li>
	</ul>
</script>

<script type="text/javascript">
	RED.nodes.registerType('klicktipp-subscriber-untag', {
		category: 'KlickTipp',
		color: '#DAE1FC',
		defaults: {
			klicktipp: { type: 'klicktipp-config', required: true },
			email: {
				value: 'payload.email',
				required: true,
				validate: RED.validators.typedInput('emailType'),
			},
			emailType: { value: 'msg' },
			tagId: { value: [] },
			manualTagId: { value: '' },
			manualFieldEnabled: { value: false },
			name: { value: '' },
		},
		inputs: 1,
		outputs: 1,
		icon: 'klicktipp.svg',
		label: function () {
			return this.name || 'Untag Contact';
		},
		labelStyle: 'klicktipp_label_style',
		paletteLabel: 'Untag Contact',
		onadd: function () {
			ktPopulateConfig(this);
		},
		oneditprepare: function () {
			var self = this;
			const klicktippInput = $('#node-input-klicktipp');
			const tagDropdown = $('#node-input-tagId');
			const tagManual = $('#node-input-tagIdManual');
			const toggle = $('#node-input-toggleFieldType');
			const btnCreateTag = $('#btn-create-tag-untag');
			const { syncDraftState, writeSelectDraft } = ktBindDualInputDraftState({
				selectEl: tagDropdown,
				manualEl: tagManual,
				nodeRef: self,
				valueKey: 'tagId',
				manualKey: 'manualTagId',
				readSelectValue: () => {
					const currentValue = tagDropdown.val();
					return Array.isArray(currentValue)
						? currentValue
						: currentValue
							? [currentValue]
							: undefined;
				},
				writeSelectValue: (value) => {
					const nextValue = Array.isArray(value)
						? value.map(String)
						: value === undefined || value === null || value === ''
							? []
							: [String(value)];
					tagDropdown.val(nextValue);
				},
			});

			function setCreateBtnEnabled(enabled) {
				btnCreateTag
					.prop('disabled', !enabled)
					.css('opacity', enabled ? 1 : 0.5)
					.attr('title', enabled ? 'Create new tag' : 'Switch off "Map" to create a new tag');
			}

			function markDirty() {
				try {
					RED.nodes.dirty(true);
				} catch (e) {}
			}

			function getCurrentTagIdsFromSelect() {
				return ktNormalizeTagIds(tagDropdown.val());
			}

			function getCurrentTagIdsFromManual() {
				return ktNormalizeTagIds(tagManual.val());
			}

			function updateDisplay() {
				syncDraftState();
				const isManual = self.manualFieldEnabled === true || self.manualFieldEnabled === 'true';
				toggle.prop('checked', isManual);

				if (isManual) {
					const nextManualValue = tagManual.is(':visible') ? tagManual.val() : self.manualTagId;
					tagManual.show();
					tagDropdown.hide();
					tagManual.val(nextManualValue || '');
					setCreateBtnEnabled(false);
				} else {
					const nextSelectedValue = Array.isArray(tagDropdown.val())
						? tagDropdown.val()
						: Array.isArray(self.tagId)
							? self.tagId.map(String)
							: [];
					tagManual.hide();
					tagDropdown.show();
					writeSelectDraft(nextSelectedValue);
					setCreateBtnEnabled(true);
				}
			}

			toggle.on('change', function () {
				syncDraftState();
				self.manualFieldEnabled = toggle.prop('checked');
				if (self.manualFieldEnabled) {
					self.manualTagId = ktTagIdsToManualString(self.tagId);
				} else {
					self.tagId = getCurrentTagIdsFromManual();
				}
				updateDisplay();
				markDirty();
			});

			tagDropdown.on('change', function () {
				if (!$('#node-input-toggleFieldType').is(':checked')) {
					self.tagId = getCurrentTagIdsFromSelect();
					self.manualTagId = ktTagIdsToManualString(self.tagId);
					markDirty();
				}
			});

			tagManual.on('input change', function () {
				self.manualTagId = tagManual.val();
				self.tagId = getCurrentTagIdsFromManual();
				markDirty();
			});

			klicktippInput.on('input change', updateDisplay);

			const container = $('#dialog-form')[0];
			if (container) {
				const observer = new MutationObserver(() => updateDisplay());
				observer.observe(container, { childList: true, subtree: true });
			}

			ktInitializeTypedInput('#node-input-email', '#node-input-emailType', 'str', ['str']);
			ktAlignSimpleFormRows();

			function cacheKey() {
				const cfg = klicktippInput.val() || 'none';
				return `kt_tag_names:${self.id}:${cfg}`;
			}
			function readNameCache() {
				try {
					return JSON.parse(localStorage.getItem(cacheKey()) || '{}') || {};
				} catch {
					return {};
				}
			}
			function writeNameCache(map) {
				try {
					localStorage.setItem(cacheKey(), JSON.stringify(map || {}));
				} catch {}
			}
			function rememberName(id, name) {
				const map = readNameCache();
				map[String(id)] = String(name);
				writeNameCache(map);
			}
			function fallbackAllFromCache() {
				const map = readNameCache();
				return Object.keys(map).map((id) => ({ id, name: map[id] }));
			}

			function refreshTagsSorted(ids, fallbackOpts) {
				const selected = (ids || []).map(String);
				const cfgId = $('#node-input-klicktipp').val();
				if (!cfgId) {
					ktPopulateSelect(
						tagDropdown,
						ktCurrentOptions(tagDropdown),
						selected,
						'Select an option',
					);
					return $.Deferred().resolve().promise();
				}
				return ktRefreshTagsSelect(tagDropdown, self.id, cfgId, selected, fallbackOpts);
			}

			const openWant = Array.isArray(self.tagId)
				? self.tagId.map(Number)
				: self.tagId
					? [Number(self.tagId)]
					: [];
			updateDisplay();
			setTimeout(updateDisplay, 200);
			setTimeout(() => refreshTagsSorted(openWant, fallbackAllFromCache()), 800);

			klicktippInput.on('change', function () {
				const want = tagDropdown.val() || self.tagId || [];
				refreshTagsSorted(want, fallbackAllFromCache());
			});

			const MODAL_SEL = '#create-tag-modal-untag';
			(function cleanupStale() {
				const $stale = $('body').children(MODAL_SEL + '.ui-dialog-content');
				if ($stale.length) {
					try {
						$stale.dialog('destroy');
					} catch (e) {}
					$stale.remove();
				}
			})();

			const $createModal = $('#dialog-form')
				.find(MODAL_SEL)
				.dialog({
					autoOpen: false,
					modal: true,
					title: 'Create Tag',
					width: 420,
					buttons: {
						Create: function () {
							const name = $createModal.find('#create-tag-name-untag').val().trim();
							const text = $createModal.find('#create-tag-text-untag').val().trim();
							if (!name) {
								RED.notify('Please enter a tag name', 'error');
								return;
							}

							const configId = $('#node-input-klicktipp').val();
							if (!configId) {
								RED.notify('Missing KlickTipp Config', 'error');
								return;
							}
							if (toggle.prop('checked')) {
								RED.notify('Switch off "Map" (manual) mode to create a new tag', 'warning');
								return;
							}

							ktCreateTag(configId, name, text)
								.done(function (resp) {
									const newId = ktExtractNewTagId(resp);
									if (!newId) {
										RED.notify('Tag created, but no ID returned by API', 'warning');
										$createModal.dialog('close');
										return;
									}

									if (!tagDropdown.find('option[value="' + newId + '"]').length) {
										$('<option>', { value: newId, text: name }).appendTo(tagDropdown);
									}
									const current = tagDropdown.val() || [];
									const nextVal = Array.from(new Set([].concat(current || [], [newId])));
									tagDropdown.val(nextVal).trigger('change');
									self.tagId = nextVal.map((v) => Number(v));
									rememberName(newId, name);
									setTimeout(() => refreshTagsSorted(nextVal, fallbackAllFromCache()), 800);
									RED.notify('Tag created', 'success');
									$createModal.dialog('close');
								})
								.fail(function (jq) {
									RED.notify(ktAjaxErrorMessage(jq, 'Failed to create tag'), 'error');
								});
						},
						Cancel: function () {
							$createModal.dialog('close');
						},
					},
					open: function () {
						$createModal.find('#create-tag-name-untag').val('');
						$createModal.find('#create-tag-text-untag').val('');
						setTimeout(() => $createModal.find('#create-tag-name-untag').trigger('focus'), 50);
					},
				});

			btnCreateTag.on('click', function () {
				if (toggle.prop('checked')) {
					RED.notify('Switch off "Map" (manual) mode to create a new tag', 'warning');
					return;
				}
				$createModal.dialog('open');
			});

			this.__cleanupCreateModal = function () {
				const $m = $('body').children(MODAL_SEL + '.ui-dialog-content');
				if ($m.length) {
					try {
						$m.dialog('destroy');
					} catch (e) {}
					$m.remove();
				}
			};
		},
		oneditcancel: function () {
			this.__cleanupCreateModal && this.__cleanupCreateModal();
		},
		oneditsave: function () {
			this.__cleanupCreateModal && this.__cleanupCreateModal();
			const manualEnabled = $('#node-input-toggleFieldType').is(':checked');
			this.manualFieldEnabled = manualEnabled;

			if (manualEnabled) {
				this.manualTagId = $('#node-input-tagIdManual').val();
				this.tagId = ktNormalizeTagIds(this.manualTagId);
			} else {
				this.tagId = ktNormalizeTagIds($('#node-input-tagId').val());
				this.manualTagId = ktTagIdsToManualString(this.tagId);
			}
		},
	});
</script>
